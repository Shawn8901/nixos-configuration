creation_rules:
  - path_regex: modules(/.*)*/secrets.yaml
    key_groups:
      - age: *all
  - path_regex: hosts/pointalpha/[^/]+\.yaml$
    key_groups:
      - age:
          - *shawn
          - *pointalpha
  - path_regex: hosts/pointjig/[^/]+\.yaml$
    key_groups:
      - age:
          - *shawn
          - *pointjig
  - path_regex: hosts/shelter/[^/]+\.yaml$
    key_groups:
      - age:
          - *shawn
          - *shelter
  - path_regex: hosts/tank/[^/]+\.yaml$
    key_groups:
      - age:
          - *shawn
          - *tank
  - path_regex: hosts/zenbook/[^/]+\.yaml$
    key_groups:
      - age:
          - *shawn
          - *zenbook
  - path_regex: hosts/watchtower/[^/]+\.yaml$
    key_groups:
      - age:
          - *shawn
          - *watchtower
  - path_regex: hosts/beacon/[^/]+\.yaml$
    key_groups:
      - age:
          - *shawn
          - *beacon
